<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo principal -->
  <rect width="1200" height="630" fill="#0D1F5C"/>

  <!-- Panel decorativo derecho -->
  <rect x="760" y="0" width="440" height="630" fill="#081440"/>

  <!-- Líneas arquitectónicas decorativas (derecha) -->
  <line x1="820" y1="0" x2="820" y2="630" stroke="#005BAA" stroke-width="1.5" opacity="0.4"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#005BAA" stroke-width="1" opacity="0.25"/>
  <line x1="980" y1="0" x2="980" y2="630" stroke="#005BAA" stroke-width="1" opacity="0.25"/>
  <line x1="1060" y1="0" x2="1060" y2="630" stroke="#005BAA" stroke-width="1" opacity="0.25"/>
  <line x1="1140" y1="0" x2="1140" y2="630" stroke="#005BAA" stroke-width="1" opacity="0.25"/>

  <!-- "Edificios" abstractos -->
  <rect x="860" y="200" width="60" height="430" fill="#005BAA" opacity="0.3" rx="2"/>
  <rect x="940" y="140" width="50" height="490" fill="#005BAA" opacity="0.25" rx="2"/>
  <rect x="1010" y="260" width="70" height="370" fill="#005BAA" opacity="0.2" rx="2"/>
  <rect x="1100" y="180" width="55" height="450" fill="#005BAA" opacity="0.2" rx="2"/>

  <!-- Barra superior verde -->
  <rect width="1200" height="7" fill="#27AE27"/>

  <!-- Barra inferior azul -->
  <rect y="623" width="1200" height="7" fill="#005BAA"/>

  <!-- Separador vertical -->
  <rect x="755" y="40" width="2" height="550" fill="#27AE27" opacity="0.5"/>

  <!-- ── Contenido izquierdo ── -->

  <!-- GII letras grandes -->
  <text
    x="80"
    y="220"
    font-family="system-ui, Arial, sans-serif"
    font-size="130"
    font-weight="900"
    fill="white"
    letter-spacing="-4"
    opacity="0.15"
  >GII</text>

  <!-- Línea decorativa sobre el texto -->
  <rect x="80" y="252" width="100" height="5" fill="#27AE27" rx="2"/>

  <!-- Nombre de empresa -->
  <text
    x="80"
    y="310"
    font-family="system-ui, Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="white"
  >Grupo de Infraestructura</text>
  <text
    x="80"
    y="372"
    font-family="system-ui, Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="#27AE27"
  >Integral</text>

  <!-- Subtítulo -->
  <text
    x="80"
    y="430"
    font-family="system-ui, Arial, sans-serif"
    font-size="22"
    font-weight="400"
    fill="rgba(255,255,255,0.6)"
    letter-spacing="3"
  >PROYECTO · CONSTRUCCIÓN · SUPERVISIÓN</text>

  <!-- Separador -->
  <rect x="80" y="465" width="80" height="3" fill="#27AE27" rx="1.5"/>

  <!-- URL / dominio -->
  <text
    x="80"
    y="530"
    font-family="system-ui, Arial, sans-serif"
    font-size="24"
    font-weight="500"
    fill="rgba(255,255,255,0.45)"
  >grupogii.com</text>

  <!-- Punto azul decorativo antes del dominio -->
  <circle cx="62" cy="520" r="4" fill="#005BAA" opacity="0.7"/>
</svg>
